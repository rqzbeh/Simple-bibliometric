services:
  # Redis for job queue
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI server
  api:
    build: .
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - BIB_USE_RQ=1
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./analysis_outputs:/app/analysis_outputs
    command: uvicorn api:app --host 0.0.0.0 --port 8000 --workers 2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # RQ Worker for background jobs
  worker:
    build: .
    restart: always
    env_file:
      - .env
    environment:
      - BIB_USE_RQ=1
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./analysis_outputs:/app/analysis_outputs
    command: rq worker simple-bib-queue --url redis://redis:6379/0
    deploy:
      replicas: 2  # Scale workers as needed

  # Streamlit dashboard (optional)
  streamlit:
    build: .
    restart: always
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - LOG_LEVEL=INFO
    depends_on:
      - redis
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  redis-data:
    driver: local

networks:
  default:
    name: bibliometric-network
