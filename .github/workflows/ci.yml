name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python test_crawlers.py
          python test_jobs.py
          # Optional tests (may be skipped if fakeredis / TestClient not available)
          python test_redis_artifacts.py || true
          python test_api_jobs.py || true

      - name: Lint (non-failing)
        run: |
          python -m pip install flake8
          flake8 || true
